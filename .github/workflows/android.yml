# Builds Zol and runs the unit tests on every push. A tag such as v1.1 also publishes the APK on the Releases page.
# Signed releases: add the repository secrets KEYSTORE_BASE64 (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD. Without them the release carries a debug-signed APK (fine for testing; updates need the same key).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The GitHub runner already has the Android SDK; Gradle fetches the platform it needs.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: zol-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ZOL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZOL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ZOL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zol.jks"
            export ZOL_KEYSTORE="$RUNNER_TEMP/zol.jks"
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "zol-${GITHUB_REF_NAME}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "zol-${GITHUB_REF_NAME}-debug.apk"
          fi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: zol-*.apk
          generate_release_notes: true
